<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Spotify</title>
</head>
<body>
    <header>
        <div class="top">
            <div class="logo-left">
                <img src="assets/spotify-logo-white.png" alt="Spotify logo"></img>
            </div>
            <div class="top-mid">
                <div class="home">
                    <img src="assets/home.png" alt="home" class="top-logo"></img>
                </div>
                    
                    <div class="search">
                        <img src="assets/search.png">
                        <input placeholder="What do you want to play?">
                    </div>
            </div>
                    
                
            <div class="top-right">
                    <p>Explore Premium</p>
            </div>
        </div>
    </header>
    <main>
    <div class="main">
        <div class="left-sidebar">
            <div class="album">
                <div class="playlist">
                    <img src="assets/global50.jpeg" class="cover">
                    <img src="assets/play.png" class="play">
                    <play class="png"></play>
                    <div class="playlist-info">
                        <p class="playlist-title">Top 50 Global</p>
                        <p class="playlist-desc">Playlist  &bull;  Top 50 Global</p>
                    </div>
                </div>
                <div class="playlist">
                    <img src="assets/playlist1.jpg">
                    <img src="assets/play.png" class="play">

                    <div class="playlist-info">
                        <p class="playlist-title">BASTA</p>
                        <p class="playlist-desc">Playlist  &bull;  nyash</p>
                    </div>
                </div>
                <div class="playlist">
                    <img src="assets/playlist2.jpg">
                    <img src="assets/play.png" class="play">

                    <div class="playlist-info">
                        <p class="playlist-title">New Music Friday</p>
                        <p class="playlist-desc">Playlist  &bull;  New Music Firday</p>
                    </div>
                </div>
                <div class="playlist"></div>
                <div class="playlist"></div>
                <div class="playlist"></div>
                <div class="playlist"></div>
                <div class="playlist"></div>
                <div class="playlist"></div>


            </div>
        </div>
        <div class="middle-content">middle</div>
        <div class="right-sidebar">right</div> 
    </div>
    </main>
    <footer>
        <div class="music-player"><p>bottom</p></div>
    </footer>
</body>
</html>
